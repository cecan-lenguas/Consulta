        return `<div class="${clase}"><div class="num">${numeroCarta(cfg, id)}</div><div class="img"><img src="${esc(imagen(id, clase === 'carta' ? 800 : 500))}" alt=""></div><div class="nombre"${Texto.lang(L)}>${esc(nombreCarta(id, L))}</div></div>`;
    }
    function tablaHTML(cfg, t, k) {
        return `<div class="tabla"><header><span>LOTERÍA</span><span class="tit">${esc(cfg.nombre)}</span><span>Tabla ${k}</span></header>
            <div class="rejilla">${t.map(id => cartaHTML(cfg, id, 'celda')).join('')}</div><footer>Juego ${esc(cfg.semilla)}</footer></div>`;
    }
    /** Abre una ventana con hojas listas para imprimir; espera a que carguen las imágenes. */
    function ventanaImpresion(titulo, paginas, orientacion, descripcion, css) {
        const v = window.open('', '_blank');
        if (!v) return msg('El navegador bloqueó la ventana de impresión. Permite las ventanas emergentes para este sitio.', 'error');
        v.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${esc(titulo)}</title><style>@page{size:letter ${orientacion};margin:5mm}${css}</style></head><body>
            <div class="barra"><b>${esc(descripcion)}</b><span>Imprime en <b>Carta</b>, <b>${orientacion === 'landscape' ? 'horizontal' : 'vertical'}</b>, escala 100 %.</span><button onclick="print()">🖨️ Imprimir o guardar PDF</button></div>
            ${paginas}
            <script>(function(){var h=false;function ir(){if(h)return;h=true;setTimeout(function(){window.print()},300)}var im=[].slice.call(document.images),p=im.length;if(!p)return ir();im.forEach(function(i){if(i.complete){if(--p===0)ir()}else{i.onload=i.onerror=function(){if(--p===0)ir()}}});setTimeout(ir,15000)})();<\/script></body></html>`);
        v.document.close();
        msg(`Se abrió la vista de impresión: ${esc(descripcion)}.`);
    }
    function imprimir(tipo) {
        const c = B; let pag = '', o = 'landscape', d = '';
        if (tipo === 'cartas') {
            for (let p = 0; p < c.ids.length; p += 8) pag += `<section class="hoja cartas">${c.ids.slice(p, p + 8).map(id => cartaHTML(c, id, 'carta')).join('')}</section>`;
            d = `${c.ids.length} cartas · ${Math.ceil(c.ids.length / 8)} hojas`;
        } else {
            const n = Math.max(1, Math.min(200, parseInt($('l-nt').value, 10) || 1)), fmt = $('l-fmt').value, ts = LN.tablas(c, n);
            c.impresas = Math.max(c.impresas || 0, ts.length);
            if (fmt === 'media') { for (let p = 0; p < ts.length; p += 2) pag += `<section class="hoja medias">${ts.slice(p, p + 2).map((t, i) => tablaHTML(c, t, p + i + 1)).join('')}</section>`; d = `${ts.length} tablas en media carta · ${Math.ceil(ts.length / 2)} hojas`; }
            else { o = 'portrait'; pag = ts.map((t, i) => `<section class="hoja completa">${tablaHTML(c, t, i + 1)}</section>`).join(''); d = `${ts.length} tablas en carta · ${ts.length} hojas`; }
        }
        ventanaImpresion(`Lotería · ${c.nombre} · ${c.semilla}`, pag, o, d, CSS_IMPRESION);
    }

    /* =============================================
       3. CANTOR
       ============================================= */
    async function crearEnLinea() {
        msg('⏳ Creando la partida…');
        try {
            const secreto = nuevaSemilla(20), cfg = JSON.parse(JSON.stringify(B)), ronda = cuatroDigitos();
            const r = await Datos.post({ accion: 'lot_crear', config: cfg, secreto, ronda });
            if (r.status !== 200 || !r.numero) throw new Error(r.error || 'El script del catálogo necesita actualizarse a la versión 1.1.');
            Object.assign(S, { cfg, nombre: r.nombre, numero: r.numero, secreto, ronda: r.ronda || ronda, enLinea: true, n: 0 });
            cantor();
        } catch (e) { msg(`No se pudo crear la partida: ${esc(e.message || 'sin conexión')}.<br>Puedes cantar aquí sin internet o descargar el archivo.`, 'error'); }
    }
    function cantor(retomar = false) {
        detener(); activo();
        Object.assign(S, { rol: 'cantor', orden: LN.ordenCanto(S.cfg, S.ronda), fin: retomar ? S.fin : false, ganadores: [], jugadores: [], vistos: new Set() });
        UI.abrir('<div></div>');
        pintarCantor();
        if (S.enLinea) { guardarAnfitrion(); sincronizarCantor(); S.poll = setInterval(sincronizarCantor, 4000); }
        if (S.cfg.cantor.auto) auto(true);
        Pantalla.mantener();
    }
    function cartaGrande(id) {
        const p = w(id), L = S.cfg.lengua;
        const otras = S.cfg.lenguasJugador ? Object.keys(p.t).filter(x => x !== L).map(x => `${esc(Datos.nombreLengua(x))}: <b${Texto.lang(x)}>${esc(p.t[x].texto)}</b>`) : [];
        return `<div class="lot-carta" aria-live="polite"><div class="num">${numeroCarta(S.cfg, id)}</div><div class="img"><img src="${esc(imagen(id, 600))}" alt="${esc(nombreCarta(id, L))}"></div>
            <div class="lot-nombre"${Texto.lang(L)}>${esc(nombreCarta(id, L))}</div></div>
            ${otras.length ? `<div class="nota" style="text-align:center;margin-top:6px">${otras.join(' · ')}</div>` : ''}
            ${audioDe(id) ? `<div style="text-align:center;margin-top:6px">${Sonido.boton(p, L, '🔊 Escuchar')}</div>` : ''}`;
    }
    function variantesHTML() {
        return S.cfg.variantes.map(v => { const g = S.ganadores.find(x => x.variante === v); return `<span class="lot-var ${g ? 'ganada' : ''}">${g ? '🏆' : '⏳'} ${esc(nombreVariante(v))}${g ? ': ' + esc(g.nombre) : ''}</span>`; }).join('');
    }
    function pintarCantor() {
        const c = S.cfg, total = S.orden.length, id = S.n ? S.orden[S.n - 1] : null;
        const hist = S.orden.slice(0, Math.max(0, S.n - 1)).reverse().map(i => `<figure><img src="${esc(imagen(i, 120))}" alt=""><figcaption${Texto.lang(c.lengua)}>${esc(nombreCarta(i, c.lengua))}</figcaption></figure>`).join('');
        UI.cuerpo(`${S.enLinea ? `<div class="lot-codigo">Para unirse: <b>${esc(S.nombre)} ${esc(S.numero)}</b>
                <div class="fila" style="justify-content:center;margin-top:8px"><button class="btn btn-secondary" id="lc-comp">📤 Compartir enlace</button><button class="btn btn-secondary" id="lc-copia">📋 Copiar</button></div>
                <div class="nota" id="lc-jug">👥 Esperando jugadores…</div></div>`
            : `<div class="caja nota" style="margin-top:0">Sin conexión · juego <b>${esc(c.semilla)}</b>: se juega con tablas impresas o descargadas de este juego.</div>`}
            <div class="lot-contador">Ronda ${esc(S.ronda)} · carta ${S.n} de ${total}</div>
            ${id ? cartaGrande(id) : '<div class="caja" style="text-align:center">Toca <b>Siguiente carta</b> para empezar.</div>'}
            <div class="lot-variantes" id="lc-vars">${variantesHTML()}</div>
            ${S.fin ? '<div class="round-result win">🏁 Ronda terminada</div>' : `<div class="acciones" style="flex-direction:column;align-items:stretch">
                <button class="btn btn-primary" id="lc-sig" style="min-height:64px;font-size:1.2em" ${S.n >= total ? 'disabled' : ''}>▶ Siguiente carta</button>
                <label class="chip" style="justify-content:center"><input type="checkbox" id="lc-auto" ${S.auto ? 'checked' : ''}> Avanzar solo cada
                    <select id="lc-seg" class="modern-select" style="width:auto;min-height:32px;padding:4px 8px">${[5, 8, 10, 15, 20, 30].map(s => `<option ${c.cantor.seg === s ? 'selected' : ''}>${s}</option>`).join('')}</select> s</label></div>`}
            ${hist ? `<details style="margin-top:12px"><summary>Cartas que ya salieron (${S.n - 1})</summary><div class="lot-hist">${hist}</div></details>` : ''}
            <div class="acciones">
                <button class="btn btn-secondary" id="lc-ver">🔍 Verificar una tabla</button>
                <button class="btn btn-secondary" id="lc-ronda">🔁 Nueva ronda (mismas tablas)</button>
                ${!S.fin ? '<button class="btn btn-danger" id="lc-fin">🏁 Terminar ronda</button>' : ''}
                <button class="btn btn-secondary" id="lc-nueva">🎴 Otra lotería</button></div>`);
        const on = (i, f, ev = 'click') => { const e = $(i); if (e) e.addEventListener(ev, f); };
        on('lc-sig', siguiente); on('lc-auto', e => auto(e.target.checked), 'change');
        on('lc-seg', e => { S.cfg.cantor.seg = +e.target.value; if (S.auto) auto(true); }, 'change');
        on('lc-ver', () => verificar()); on('lc-ronda', nuevaRonda); on('lc-fin', terminar); on('lc-nueva', () => { if (confirm('¿Salir de esta lotería?')) { detener(); LS.del(llaveAnf()); config(B || predeterminada()); } });
        on('lc-comp', compartir); on('lc-copia', copiar);
        pintarJugadores();
    }
    function pintarJugadores() { const el = $('lc-jug'); if (el) el.textContent = S.jugadores.length ? `👥 ${S.jugadores.length}: ${S.jugadores.map(j => `${j.nombre} (tabla ${j.tabla})`).join(', ')}` : '👥 Esperando jugadores…'; }
    function siguiente() {
        if (S.fin || S.n >= S.orden.length) return auto(false);
        S.n++;
        if (S.cfg.audio) { const a = audioDe(S.orden[S.n - 1]); if (a) Sonido.tocar(a); }
        pintarCantor(); guardarAnfitrion();
        if (S.enLinea) Datos.post({ accion: 'lot_actualizar', nombre: S.nombre, numero: S.numero, secreto: S.secreto, n: S.n, ronda: S.ronda }).catch(() => {});
        if (S.n >= S.orden.length) { auto(false); UI.toast('Ya salieron todas las cartas'); }
    }
    function auto(si) {
        clearInterval(S.auto); S.auto = null;
        if (si && !S.fin && S.n < S.orden.length) S.auto = setInterval(siguiente, (S.cfg.cantor.seg || 8) * 1000);
        const c = $('lc-auto'); if (c) c.checked = !!S.auto;
    }
    async function sincronizarCantor() {
        try {
            const r = await Datos.api({ action: 'lot_estado', nombre: S.nombre, numero: S.numero }, 10000);
            if (r.status !== 200) return;
            S.jugadores = r.estado.jugadores || [];
            if (r.estado.ronda === S.ronda) { S.ganadores = r.estado.ganadores || []; avisarGanadores(); }
            const v = $('lc-vars'); if (v) v.innerHTML = variantesHTML();
            pintarJugadores();
            if (r.estado.fin && r.estado.ronda === S.ronda && !S.fin) { S.fin = true; auto(false); pintarCantor(); }
        } catch (e) { /* sin señal: se reintenta */ }
    }
    function terminar() {
        if (!confirm('¿Terminar esta ronda para todos?')) return;
        S.fin = true; auto(false);
        if (S.enLinea) Datos.post({ accion: 'lot_actualizar', nombre: S.nombre, numero: S.numero, secreto: S.secreto, fin: true }).catch(() => {});
        pintarCantor();
    }
    function nuevaRonda() {
        if (S.n && !S.fin && !confirm('¿Empezar una ronda nueva? Las tablas siguen siendo las mismas; cambia el orden de las cartas.')) return;
        let r; do { r = cuatroDigitos(); } while (r === S.ronda);
        Object.assign(S, { ronda: r, n: 0, fin: false, ganadores: [], orden: LN.ordenCanto(S.cfg, r) });
        auto(false);
        if (S.enLinea) Datos.post({ accion: 'lot_actualizar', nombre: S.nombre, numero: S.numero, secreto: S.secreto, ronda: r, n: 0, fin: false }).catch(() => {});
        guardarAnfitrion(); pintarCantor();
        if (S.cfg.cantor.auto) auto(true);
    }
    async function compartir() {
        const u = enlace(S.nombre, S.numero), t = `¡Juguemos lotería! Partida: ${S.nombre} ${S.numero}. Entra aquí: ${u}`;
        if (navigator.share) { try { await navigator.share({ title: 'Lotería', text: t, url: u }); return; } catch (e) { return; } }
        window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
    }
    async function copiar() { const u = enlace(S.nombre, S.numero); try { await navigator.clipboard.writeText(u); UI.toast('Enlace copiado'); } catch (e) { prompt('Copia este enlace:', u); } }

    /** Verificación de cualquier tabla (impresa, descargada o en pantalla) contra las cartas que ya salieron. */
    function verificar(k = '') {
        const c = S.cfg, salidas = S.orden.slice(0, S.n);
        let res = '';
        const n = parseInt(k, 10);
        if (n > 0) {
            const t = LN.tabla(c, n);
            if (!t) res = '<div class="error-box">No se pudo generar esa tabla.</div>';
            else {
                const rev = LN.revisar(c, t, salidas), s = new Set(salidas);
                const pat = new Set((rev.find(x => x.completo) || {}).patron || []);
                res = `<div class="lot-variantes">${rev.map(x => `<span class="lot-var ${x.completo ? 'ganada' : ''}">${x.completo ? '✅' : '—'} ${esc(x.nombre)}</span>`).join('')}</div>
                    <div class="lot-tabla">${t.map((id, i) => `<div class="lot-celda ${s.has(id) ? 'salio' : 'nosalio'} ${pat.has(i) ? 'marcada' : ''}"><span class="n">${numeroCarta(c, id)}</span><img src="${esc(imagen(id, 200))}" alt=""><span class="nm"${Texto.lang(c.lengua)}>${esc(nombreCarta(id, c.lengua))}</span></div>`).join('')}</div>
                    <p class="nota">En color: ya salieron. Opacas: aún no. ${rev.some(x => x.completo) ? '<b>¡Esta tabla gana!</b>' : 'Todavía no completa ninguna forma de ganar.'}</p>
                    ${rev.filter(x => !x.completo).length ? `<p class="nota">Si dice que completó y no aparece ✅, revisen estas que aún no salen: ${t.filter(id => !s.has(id)).slice(0, 8).map(id => esc(nombreCarta(id, c.lengua))).join(', ')}…</p>` : ''}`;
            }
        }
        UI.cuerpo(`<h2 class="modal-titulo">🔍 Verificar una tabla</h2>
            <p class="nota">Ronda ${esc(S.ronda)} · ${S.n} cartas cantadas. Escribe el número de la tabla (está arriba a la derecha).</p>
            <div class="fila"><input id="lv-n" type="number" min="1" inputmode="numeric" class="input-box" style="width:120px" value="${esc(k)}"><button class="btn btn-primary" id="lv-ok">Revisar</button></div>
            ${res}
            <div class="acciones"><button class="btn btn-secondary" id="lv-volver">← Volver a cantar</button></div>`);
        $('lv-ok').addEventListener('click', () => verificar($('lv-n').value));
        $('lv-n').addEventListener('keydown', e => { if (e.key === 'Enter') verificar($('lv-n').value); });
        $('lv-volver').addEventListener('click', pintarCantor);
    }

    /* =============================================
       4. JUGADOR EN LÍNEA
       ============================================= */
    function pantallaUnirse(nombre = '', numero = '') {
        detener(); activo();
        UI.abrir(`<div class="form"><h2 class="modal-titulo">🎲 Unirme a una lotería</h2>
            <p class="nota">Pide a quien canta el nombre de la partida y sus 4 números.</p>
            <div class="fila"><input id="lu-nom" class="input-box" style="flex:2;min-width:140px" maxlength="20" placeholder="Nombre de la partida" value="${esc(nombre)}" aria-label="Nombre de la partida">
                <input id="lu-num" class="input-box" style="flex:1;min-width:90px;font-size:1.3em;letter-spacing:3px;text-align:center" inputmode="numeric" maxlength="4" placeholder="0000" value="${esc(numero)}" aria-label="Cuatro números"></div>
            <label class="t" for="lu-yo">Tu nombre (opcional)</label>
            <input id="lu-yo" class="input-box" maxlength="40" value="${esc(LS.get('lot_nombre', ''))}" placeholder="Así te anunciarán si ganas">
            <div id="lot-msg"></div>
            <div class="acciones"><button class="btn btn-primary" id="lu-ok">Entrar ➔</button></div></div>`);
        $('lu-ok').addEventListener('click', () => unirse());
    }
    async function unirse(nombreD, numeroD) {
        const nombre = String(nombreD ?? $('lu-nom')?.value ?? '').trim(), numero = String(numeroD ?? $('lu-num')?.value ?? '').replace(/\D/g, '');
        if (!nombre || numero.length !== 4) return msg('Escribe el nombre de la partida y sus 4 números.', 'error');
        const yo = ($('lu-yo')?.value ?? LS.get('lot_nombre', '')).trim();
        if ($('lu-yo')) LS.set('lot_nombre', yo);
        msg('⏳ Entrando…');
        const llave = `lot_jugador:${Texto.pliegue(nombre)}:${numero}`;
        try {
            const previo = LS.get(llave);
            let r;
            if (previo) {
                r = await Datos.api({ action: 'lot_info', nombre, numero });
                if (r.status !== 200) throw new Error(r.error);
                Object.assign(S, { tablaN: previo.tabla, jugador: previo.jugador, marcas: new Set(previo.ronda === r.estado.ronda ? previo.marcas : []), reclamadas: new Set(previo.ronda === r.estado.ronda ? previo.reclamadas : []) });
            } else {
                r = await Datos.post({ accion: 'lot_unirse', nombre, numero, jugador: yo });
                if (r.status !== 200) throw new Error(r.error);
                Object.assign(S, { tablaN: r.tabla, jugador: r.jugador, marcas: new Set(), reclamadas: new Set() });
            }
            if (r.config.ids.some(id => !w(id))) throw new Error('Esta partida usa cartas de otro catálogo o que ya no están publicadas.');
            Object.assign(S, { rol: 'jugador', llave, cfg: r.config, nombre: r.config.nombre, numero, enLinea: true, ronda: r.estado.ronda, orden: LN.ordenCanto(r.config, r.estado.ronda),
                n: r.estado.n, fin: r.estado.fin, ganadores: r.estado.ganadores || [], vistos: new Set((r.estado.ganadores || []).map(g => r.estado.ronda + '|' + g.variante + '|' + g.tabla)),
                fallos: 0, manualN: false, lenguaVista: LS.get('lot_lengua', '') && w(r.config.ids[0])?.t[LS.get('lot_lengua', '')] ? LS.get('lot_lengua', '') : r.config.lengua });
            S.tabla = LN.tabla(S.cfg, S.tablaN);
            guardarJugador(); pintarJugador();
            S.poll = setInterval(sincronizarJugador, 3000);
            Pantalla.mantener();
        } catch (e) {
            if (!$('lu-nom')) pantallaUnirse(nombre, numero);
            msg('No se pudo entrar: ' + esc(e.message || 'sin conexión'), 'error');
        }
    }
    function guardarJugador() { LS.set(S.llave, { tabla: S.tablaN, jugador: S.jugador, ronda: S.ronda, marcas: [...S.marcas], reclamadas: [...S.reclamadas] }); }
    /** Lenguas en que existen todas las cartas de la tabla. */
    function lenguasTabla() { return Datos.langs.filter(l => S.tabla.every(id => w(id)?.t[l.id])); }
    function pintarJugador(aviso = '') {
        const c = S.cfg, id = S.n ? S.orden[S.n - 1] : null, L = S.lenguaVista;
        const lenguas = c.lenguasJugador && lenguasTabla().length > 1 ? `<div class="fila" style="justify-content:center;margin:6px 0"><label for="lj-l" class="nota"><b>Ver mi tabla en:</b></label>
            <select id="lj-l" class="modern-select" style="width:auto">${lenguasTabla().map(l => `<option value="${esc(l.id)}" ${l.id === L ? 'selected' : ''}>${esc(l.nombre)}</option>`).join('')}</select></div>` : '';
        UI.cuerpo(`<div style="text-align:center"><b>Tabla ${S.tablaN}</b> · ${esc(S.jugador)} · <span class="nota">${esc(S.nombre)} ${esc(S.numero)} · ronda ${esc(S.ronda)}</span></div>
            <div class="lot-variantes" id="lj-vars">${variantesHTML()}</div>
            <div class="lot-salio" id="lj-salio" aria-live="polite">${salioHTML(id)}</div>
            <div id="lj-con"></div>${lenguas}
            <div class="lot-tabla" id="lj-tabla" role="group" aria-label="Mi tabla">${S.tabla.map((cid, i) => { const m = S.marcas.has(i), nom = nombreCarta(cid, L);
                return `<button class="lot-celda ${m ? 'marcada' : ''}" data-i="${i}" aria-pressed="${m}" aria-label="${esc(nom)}${m ? ', marcada' : ''}"><span class="n">${numeroCarta(c, cid)}</span><img src="${esc(imagen(cid, 250))}" alt=""><span class="nm"${Texto.lang(L)}>${esc(nom)}</span></button>`; }).join('')}</div>
            <div id="lj-aviso">${aviso}</div>
            ${S.fin ? '<div class="round-result win">🏁 Ronda terminada. Espera la siguiente ronda.</div>' : ''}
            <p class="nota" style="text-align:center">Toca una imagen para poner o quitar tu frijol 🫘. Al completar una forma de ganar, la tabla se revisa sola.</p>`);
        $('lj-tabla').addEventListener('click', e => {
            const b = e.target.closest('.lot-celda'); if (!b || S.fin) return;
            const i = +b.dataset.i; S.marcas.has(i) ? S.marcas.delete(i) : S.marcas.add(i);
            b.classList.toggle('marcada', S.marcas.has(i)); b.setAttribute('aria-pressed', S.marcas.has(i));
            guardarJugador(); revisarMia();
        });
        $('lj-l')?.addEventListener('change', e => { S.lenguaVista = e.target.value; LS.set('lot_lengua', S.lenguaVista); pintarJugador(); });
        pintarConexion();
    }
    function salioHTML(id) {
        if (!id) return '<span class="nota">Esperando la primera carta…</span>';
        const p = w(id);
        return `<img src="${esc(imagen(id, 150))}" alt=""><div><div class="nota">Salió (${S.n} de ${S.orden.length}):</div>
            <b style="font-size:1.15em"${Texto.lang(S.lenguaVista)}>${esc(nombreCarta(id, S.lenguaVista))}</b> ${Sonido.boton(p, S.cfg.lengua)}</div>`;
    }
    function pintarConexion() {
        const el = $('lj-con'); if (!el) return;
        el.innerHTML = S.fallos >= 3 ? `<div class="caja">📶 Sin conexión. Escribe en qué carta va el cantor para revisar tu tabla:
            <input type="number" min="0" max="${S.orden.length}" value="${S.n}" class="input-box" style="width:100px;margin-top:6px" id="lj-n"></div>` : '';
        $('lj-n')?.addEventListener('change', e => { S.n = Math.max(0, Math.min(S.orden.length, parseInt(e.target.value, 10) || 0)); S.manualN = true; $('lj-salio').innerHTML = salioHTML(S.n ? S.orden[S.n - 1] : null); });
    }
    async function sincronizarJugador() {
        try {
            const r = await Datos.api({ action: 'lot_estado', nombre: S.nombre, numero: S.numero }, 8000);
            if (r.status !== 200) throw new Error(r.error);
            const antes = S.fallos; S.fallos = 0; if (antes >= 3) pintarConexion();
            const e = r.estado;
            if (e.ronda !== S.ronda) {   // nueva ronda: mismas tablas, otro orden, tabla limpia
                Object.assign(S, { ronda: e.ronda, orden: LN.ordenCanto(S.cfg, e.ronda), n: e.n, fin: e.fin, ganadores: e.ganadores || [], marcas: new Set(), reclamadas: new Set(), manualN: false });
                guardarJugador(); pintarJugador('<div class="caja">🔁 ¡Nueva ronda! Quité tus frijoles.</div>'); UI.toast('Nueva ronda');
                return true;
            }
            const cambio = e.n !== S.n;
            if (!S.manualN || e.n >= S.n) { S.n = e.n; S.manualN = false; }
            S.ganadores = e.ganadores || []; avisarGanadores();
            const v = $('lj-vars'); if (v) v.innerHTML = variantesHTML();
            if (cambio) { const s = $('lj-salio'); if (s) s.innerHTML = salioHTML(S.n ? S.orden[S.n - 1] : null); }
            if (e.fin !== S.fin) { S.fin = e.fin; pintarJugador(); }
            return true;
        } catch (e) { S.fallos++; if (S.fallos === 3) pintarConexion(); return false; }
    }
    let revisando = false;
    async function revisarMia() {
        if (revisando || S.fin) return;
        revisando = true;
        try {
            for (const v of S.cfg.variantes) {
                if (S.reclamadas.has(v) || S.ganadores.some(g => g.variante === v)) continue;
                const pat = LN.VARIANTES[v].patrones.find(p => p.every(i => S.marcas.has(i)));
                if (!pat) continue;
                if (!S.manualN) await sincronizarJugador();
                const salidas = new Set(S.orden.slice(0, S.n)), faltan = pat.filter(i => !salidas.has(S.tabla[i]));
                if (faltan.length) {
                    faltan.forEach(i => S.marcas.delete(i)); guardarJugador(); SoundFX.error();
                    return pintarJugador(`<div class="caja">Casi: aún no han salido <b>${faltan.map(i => esc(nombreCarta(S.tabla[i], S.lenguaVista))).join(', ')}</b>. Quité esos frijoles; sigue jugando.</div>`);
                }
                S.reclamadas.add(v); guardarJugador();
                try {
                    const r = await Datos.post({ accion: 'lot_ganar', nombre: S.nombre, numero: S.numero, tabla: S.tablaN, jugador: S.jugador, variante: v, ronda: S.ronda });
                    if (r.status === 200) {
                        S.ganadores = r.estado.ganadores || S.ganadores; S.fin = !!r.estado.fin; avisarGanadores();
                        if (!r.nuevo) { const g = S.ganadores.find(x => x.variante === v); pintarJugador(`<div class="caja">¡Bien! Completaste ${esc(nombreVariante(v))}, pero ${esc(g ? g.nombre : 'alguien')} lo logró primero.</div>`); }
                        else pintarJugador();
                    } else if (r.status === 409) sincronizarJugador();
                } catch (e) { UI.anunciar(`¡${nombreVariante(v)}! Grita “¡Lotería!”`); }
            }
        } finally { revisando = false; }
    }

    function revisarEnlace() {
        const p = new URLSearchParams(location.search), nombre = p.get('loteria') || '', numero = (p.get('n') || '').replace(/\D/g, '');
        if (!nombre) return;
        if (LS.get(`lot_jugador:${Texto.pliegue(nombre)}:${numero}`)) { activo(); UI.abrir('<div id="lot-msg"></div>'); unirse(nombre, numero); }
        else pantallaUnirse(nombre, numero);
    }

    /* =============================================
       5. ARCHIVO PARA JUGAR SIN INTERNET
       ============================================= */
    /** Imágenes ligeras incrustadas: primero las pide al catálogo; si no puede, intenta desde el navegador. */
    async function imagenesLigeras(ids, avance) {
        const out = {};
        let pend = ids.slice(), vueltas = 0;
        while (pend.length && vueltas < 6) {
            vueltas++;
            const lote = pend.slice(0, 30);
            try {
                const r = await Datos.api({ action: 'paquete', ids: lote.join(','), ancho: 320 }, 240000);
                if (r.status !== 200) throw new Error(r.error);
                Object.assign(out, r.imagenes || {});
                const faltan = new Set(r.faltan || []);
                pend = pend.filter(id => !out[id] && (faltan.has(id) || !lote.includes(id)));
                lote.filter(id => !out[id] && !faltan.has(id)).forEach(id => out[id] = '');   // sin imagen en Drive
            } catch (e) { break; }
            avance(Object.values(out).filter(Boolean).length);
        }
        for (const id of ids) {
            if (out[id]) continue;
            try {   // respaldo: copiar la imagen pública desde el navegador
                const b = await (await fetch(Datos.img(w(id), 320))).blob();
                out[id] = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(''); fr.readAsDataURL(b); });
            } catch (e) { out[id] = ''; }
            avance(Object.values(out).filter(Boolean).length);
        }
        return out;
    }
    async function archivoSinConexion() {
        const c = JSON.parse(JSON.stringify(B));
        msg(`⏳ Preparando imágenes ligeras… <span id="l-av">0</span>/${c.ids.length}`);
        const imgs = await imagenesLigeras(c.ids, n => { const a = $('l-av'); if (a) a.textContent = n; });
        const sin = c.ids.filter(id => !imgs[id]).length;
        const lenguas = {}, palabras = {};
        c.ids.forEach(id => {
            const p = w(id); palabras[id] = { t: {}, img: imgs[id] || '' };
            Object.entries(p.t).forEach(([L, t]) => { if (L === c.lengua || c.lenguasJugador) { palabras[id].t[L] = t.texto; lenguas[L] = Datos.nombreLengua(L); } });
        });
        const D = { cfg: c, palabras, lenguas, titulo: Datos.cfg.titulo || '', creado: new Date().toISOString().slice(0, 10) };
        const html = `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotería ${esc(c.nombre)} · ${esc(c.semilla)}</title><style>${CSS_OFFLINE}</style></head><body><div id="app"></div>
<script>
const D = ${JSON.stringify(D).replace(/</g, '\\u003c')};
${LOT_NUCLEO.toString()}
(${LOT_APP_OFFLINE.toString()})(D, LOT_NUCLEO());
<\/script></body></html>`;
        descargar(`loteria-${c.nombre.replace(/[^\p{L}\p{N}]+/gu, '-').toLowerCase()}-${c.semilla}.html`, html);
        msg(`✅ Archivo listo (${(html.length / 1048576).toFixed(1)} MB). Compártelo por Bluetooth, WhatsApp o memoria USB: se abre en el navegador del celular sin internet.${sin ? `<br>⚠️ ${sin} carta(s) sin imagen incrustada: se verán con su número y nombre.` : ''}`);
    }

    return { abrir, pantallaUnirse, unirse, revisarEnlace, _S: S, _B: () => B, _setB: c => { B = c; } };
})();

/** Aplicación del archivo sin conexión (se copia tal cual dentro del archivo descargado). */
function LOT_APP_OFFLINE(D, LN) {
    const c = D.cfg, $ = id => document.getElementById(id);
    const e = s => String(s ?? '').replace(/[&<>"']/g, x => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]));
    const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (x) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (x) {} } };
    const K = 'lotoff:' + c.semilla;
    const st = Object.assign({ vista: 'cantar', ronda: String(Math.floor(Math.random() * 10000)).padStart(4, '0'), n: 0, tabla: 0, marcas: [], L: c.lengua, seg: 0 }, ls.get(K, {}));
    const guardar = () => ls.set(K, st);
    const nombre = (id, L = st.L) => D.palabras[id].t[L] || D.palabras[id].t[c.lengua] || '?';
    const img = (id, cls = '') => D.palabras[id].img ? `<img src="${D.palabras[id].img}" alt="">` : `<div class="ph">${c.ids.indexOf(id) + 1}</div>`;
    const num = id => c.ids.indexOf(id) + 1;
    let orden = LN.ordenCanto(c, st.ronda), reloj = null;
    document.body.insertAdjacentHTML('afterbegin', `<header><h1>🎴 Lotería · ${e(c.nombre)}</h1><p>${e(D.titulo)} · juego ${e(c.semilla)} · ${c.ids.length} cartas · funciona sin internet</p></header>
        <nav><button data-v="cantar">📣 Cantar</button><button data-v="jugar">🎴 Mi tabla</button><button data-v="verificar">🔍 Verificar</button></nav>`);
    document.querySelector('nav').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { st.vista = b.dataset.v; guardar(); pinta(); } });
    function pinta() {
        clearInterval(reloj); reloj = null;
        document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === st.vista));
        ({ cantar, jugar, verificar })[st.vista]();
    }
    function cantar() {
        const id = st.n ? orden[st.n - 1] : null;
        $('app').innerHTML = `<main><div class="nota" style="text-align:center">Ronda <b>${e(st.ronda)}</b> · carta ${st.n} de ${orden.length}</div>
            ${id ? `<div class="carta"><div class="num">${num(id)}</div><div class="im">${img(id)}</div><div class="nom">${e(nombre(id, c.lengua))}</div></div>` : '<p style="text-align:center">Toca <b>Siguiente carta</b> para empezar.</p>'}
            <div class="fila" style="justify-content:center"><button class="btn" id="sig" style="flex:1;min-height:64px" ${st.n >= orden.length ? 'disabled' : ''}>▶ Siguiente carta</button></div>
            <div class="fila" style="justify-content:center"><label>Avanzar solo cada <select id="seg"><option value="0">— no —</option>${[5, 8, 10, 15, 20].map(s => `<option ${st.seg == s ? 'selected' : ''}>${s}</option>`).join('')}</select> s</label></div>
            <details><summary>Ya salieron (${Math.max(0, st.n - 1)})</summary><div class="hist">${orden.slice(0, Math.max(0, st.n - 1)).reverse().map(i => `<figure>${D.palabras[i].img ? `<img src="${D.palabras[i].img}" alt="">` : num(i)}<figcaption>${e(nombre(i, c.lengua))}</figcaption></figure>`).join('')}</div></details>
            <div class="fila"><button class="btn s" id="nueva">🔁 Nueva ronda</button><label class="nota">o retomar la ronda <input id="rr" inputmode="numeric" maxlength="4" style="width:90px" value="${e(st.ronda)}"></label></div></main>`;
        $('sig').onclick = () => { if (st.n < orden.length) { st.n++; guardar(); cantar(); } };
        $('seg').onchange = ev => { st.seg = +ev.target.value; guardar(); cantar(); };
        $('nueva').onclick = () => { if (st.n && !confirm('¿Empezar una ronda nueva?')) return; st.ronda = String(Math.floor(Math.random() * 10000)).padStart(4, '0'); st.n = 0; orden = LN.ordenCanto(c, st.ronda); guardar(); cantar(); };
        $('rr').onchange = ev => { const r = ev.target.value.replace(/\D/g, ''); if (r.length === 4) { st.ronda = r; orden = LN.ordenCanto(c, r); st.n = 0; guardar(); cantar(); } };
        if (st.seg && st.n < orden.length) reloj = setTimeout(() => { st.n++; guardar(); cantar(); }, st.seg * 1000);
    }
    function jugar() {
        if (!st.tabla) {
            $('app').innerHTML = `<main><p>Escribe el número de tu tabla. Pídelo a quien canta (cada persona usa uno distinto), o toca “Al azar”.</p>
                <div class="fila"><input id="tn" type="number" min="1" inputmode="numeric" style="width:120px"><button class="btn" id="ok">Usar esta tabla</button><button class="btn s" id="az">🎲 Al azar</button></div></main>`;
            const usar = n => { if (n > 0) { st.tabla = n; st.marcas = []; guardar(); jugar(); } };
            $('ok').onclick = () => usar(parseInt($('tn').value, 10));
            $('az').onclick = () => usar(1 + (c.impresas || 0) + Math.floor(Math.random() * 500));
            return;
        }
        const t = LN.tabla(c, st.tabla), m = new Set(st.marcas);
        const lenguas = Object.keys(D.lenguas).filter(L => t.every(id => D.palabras[id].t[L]));
        $('app').innerHTML = `<main><div class="fila" style="justify-content:space-between"><b>Tabla ${st.tabla}</b>
                ${lenguas.length > 1 ? `<select id="lj">${lenguas.map(L => `<option value="${e(L)}" ${L === st.L ? 'selected' : ''}>${e(D.lenguas[L])}</option>`).join('')}</select>` : ''}</div>
            <div class="tabla" id="tb">${t.map((id, i) => `<div class="celda ${m.has(i) ? 'm' : ''}" data-i="${i}"><span class="n">${num(id)}</span>${img(id)}<span class="t">${e(nombre(id))}</span></div>`).join('')}</div>
            <p class="nota">Toca una imagen para poner o quitar tu frijol 🫘. Si completas, grita “¡Lotería!” y di tu número de tabla: quien canta la revisa en “Verificar”.</p>
            <div class="fila"><button class="btn s" id="limpia">Quitar frijoles</button><button class="btn s" id="otra">Cambiar de tabla</button></div></main>`;
        $('tb').onclick = ev => { const d = ev.target.closest('.celda'); if (!d) return; const i = +d.dataset.i; m.has(i) ? m.delete(i) : m.add(i); st.marcas = [...m]; guardar(); d.classList.toggle('m', m.has(i)); };
        if ($('lj')) $('lj').onchange = ev => { st.L = ev.target.value; guardar(); jugar(); };
        $('limpia').onclick = () => { st.marcas = []; guardar(); jugar(); };
        $('otra').onclick = () => { st.tabla = 0; guardar(); jugar(); };
    }
    function verificar(k) {
        let res = '';
        if (k > 0) {
            const t = LN.tabla(c, k), sal = orden.slice(0, st.n), s = new Set(sal), rev = LN.revisar(c, t, sal);
            res = `<p>${rev.map(x => `<span class="${x.completo ? 'ok' : ''}">${x.completo ? '✅' : '—'} ${e(x.nombre)}</span>`).join(' · ')}</p>
                <div class="tabla">${t.map(id => `<div class="celda ${s.has(id) ? 'si' : 'no'}"><span class="n">${num(id)}</span>${img(id)}<span class="t">${e(nombre(id, c.lengua))}</span></div>`).join('')}</div>
                <p class="nota">En color: ya salieron (ronda ${e(st.ronda)}, ${st.n} cartas). ${rev.some(x => x.completo) ? '<b class="ok">¡Esta tabla gana!</b>' : 'Todavía no completa ninguna forma de ganar.'}</p>`;
        }
        $('app').innerHTML = `<main><p>Revisa la tabla de quien grita “¡Lotería!” con las cartas que ya cantaste en este celular.</p>
            <div class="fila"><input id="vn" type="number" min="1" inputmode="numeric" placeholder="Nº de tabla" style="width:140px" value="${k || ''}"><button class="btn" id="vk">Revisar</button></div>${res}
            <p class="nota">Formas de ganar: ${c.variantes.map(v => e(LN.VARIANTES[v].nombre)).join(', ')}.</p></main>`;
        $('vk').onclick = () => verificar(parseInt($('vn').value, 10));
    }
    pinta();
}
</script>
<script>

            <label class="t" for="h-inst">Instrucción <span class="nota">(puedes escribirla en tu lengua o dejarla vacía)</span></label>
            <input id="h-inst" class="input-box">
            <div id="h-calcar" class="oculto"><label class="chip"><input type="checkbox" id="h-calca"> Palabra punteada para calcar</label></div>
            <span class="t">Hojas</span><div class="chips">${[1, 2, 3, 5, 10].map((n, i) => `<label class="chip"><input type="radio" name="h-n" value="${n}" ${i === 0 ? 'checked' : ''}> ${n}</label>`).join('')}</div>

            <details><summary class="t" style="cursor:pointer">📁 Categorías (opcional)</summary><div id="h-cats"></div></details>

            <div class="acciones"><button class="btn btn-primary" id="h-ok">🖨️ Preparar hojas</button></div></div>`);
        const ajustar = () => {
            const t = document.querySelector('input[name="h-t"]:checked').value;

            $('h-l2b').classList.toggle('oculto', !['etiquetas', 'tarjetas', 'une'].includes(t));

        $('h-l').addEventListener('change', cats); cats();
        $('h-ok').addEventListener('click', () => this.generar());
    },
    generar() {
        const tipo = document.querySelector('input[name="h-t"]:checked').value, T = this.TIPOS[tipo];
        const L = $('h-l').value, L2 = $('h-l2b').classList.contains('oculto') || $('h-l2').value === L ? '' : $('h-l2').value;
        const n = +document.querySelector('input[name="h-n"]:checked').value;
        let pool = barajar(Datos.paraJuegos(L, { img: true, cats: Comun.marcados('h-cat'), largas: tipo === 'completa' }));
        if (pool.length < Math.min(4, T.por)) return msg('Hay pocas palabras con imagen para esa selección.');
        const lote = i => { const r = []; for (let k = 0; k < T.por; k++) r.push(pool[(i * T.por + k) % pool.length]); return [...new Set(r)]; };
        const inst = $('h-inst').value.trim(), calca = $('h-calca').checked, resp = $('h-resp').checked && !$('h-resp').parentElement.classList.contains('oculto');
        const img = w => `<img src="${esc(Datos.img(w, 600))}" alt="">`;
        const pal = (w, X = L) => `<span${Texto.lang(X)}>${esc(w.t[X].texto)}</span>`;
        const cab = (i) => ['etiquetas', 'tarjetas'].includes(tipo) ? '' : `<header><div><b>${esc(T.ico)} </b>${esc(inst)}</div><div class="datos">______________________ &nbsp; ____/____/______</div></header>`;
        let pags = '', respuestas = '';
        for (let i = 0; i < n; i++) {
            const ws = lote(i); let cuerpo = '';
            if (tipo === 'une') {
                const der = barajar(ws);
                cuerpo = `<div class="une">${ws.map((w, k) => `<div class="ui">${img(w)}</div><div class="punto">●</div><div></div><div class="punto">●</div><div class="up">${pal(der[k])}${L2 && der[k].t[L2] ? `<small>${pal(der[k], L2)}</small>` : ''}</div>`).join('')}</div>`;
                respuestas += `<li>${ws.map((w, k) => `${k + 1} → ${der.indexOf(w) + 1}`).join(' · ')}</li>`;
            } else if (tipo === 'completa') {
                cuerpo = `<div class="rej2">${ws.map(w => {
                    const g = Texto.grafemas(w.t[L].texto, L), letras = g.map((x, j) => x.letra ? j : -1).filter(j => j >= 0);
                    const quitar = new Set(barajar(letras).slice(0, Math.max(1, Math.round(letras.length / 3))));
                    return `<div class="item">${img(w)}<div class="pal"${Texto.lang(L)}>${g.map((x, j) => quitar.has(j) ? '<span class="hue"></span>' : esc(x.g)).join('')}</div></div>`; }).join('')}</div>`;
                respuestas += `<li>${ws.map(w => esc(w.t[L].texto)).join(' · ')}</li>`;
            } else if (tipo === 'escribe') {
                cuerpo = `<div class="rej2">${ws.map(w => `<div class="item">${img(w)}<div class="lin">${calca ? `<span class="calca"${Texto.lang(L)}>${esc(w.t[L].texto)}</span>` : ''}</div><div class="lin"></div></div>`).join('')}</div>`;
                respuestas += `<li>${ws.map(w => esc(w.t[L].texto)).join(' · ')}</li>`;
            } else if (tipo === 'dibuja') {
                cuerpo = `<div class="rej2 dib">${ws.map(w => `<div class="item"><div class="pal">${pal(w)}</div><div class="caja-d"></div></div>`).join('')}</div>`;
            } else if (tipo === 'etiquetas') {
                cuerpo = `<div class="rej2 etq">${ws.map(w => `<div class="item">${img(w)}<div class="pal">${pal(w)}</div>${L2 && w.t[L2] ? `<div class="sub">${pal(w, L2)}</div>` : ''}</div>`).join('')}</div>`;
            } else {
                cuerpo = `<div class="rej2 tar">${ws.map(w => `<div class="item">${img(w)}<div class="pal">${pal(w)}</div>${L2 && w.t[L2] ? `<div class="sub">${pal(w, L2)}</div>` : ''}</div>`).join('')}</div>`;
            }
            pags += `<section class="hoja">${cab(i)}${cuerpo}<footer>${esc(Datos.cfg.titulo || '')} · ${esc(Datos.nombreLengua(L))}</footer></section>`;
        }
        if (resp && respuestas) pags += `<section class="hoja"><header><b>✔️</b></header><ol class="resp">${respuestas}</ol></section>`;
        Hojas.ventana(`${T.nombre} · ${Datos.nombreLengua(L)}`, pags, `${n} hoja(s) · ${T.nombre}`);
    },
    CSS: `html,body{margin:0;background:#fff;color:#111;font-family:system-ui,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
        .barra{position:sticky;top:0;background:#1e3a5f;color:#fff;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
        .barra button{font-size:15px;font-weight:700;padding:8px 14px;border:0;border-radius:8px;cursor:pointer}
        @media print{.barra{display:none}} @media screen{.hoja{margin:10px auto;box-shadow:0 0 0 1px #ccc,0 4px 14px rgba(0,0,0,.15)}}
        .hoja{width:205mm;height:269mm;box-sizing:border-box;padding:6mm;display:flex;flex-direction:column;gap:4mm;overflow:hidden;break-after:page;page-break-after:always}
        .hoja:last-of-type{break-after:auto;page-break-after:auto}
        header{display:flex;justify-content:space-between;gap:6mm;font-size:13pt;border-bottom:.4mm solid #111;padding-bottom:2mm}
        header .datos{white-space:nowrap;color:#444}
        footer{font-size:7pt;color:#666;text-align:right}
        img{max-width:100%;max-height:100%;object-fit:contain}
        .une{flex:1;display:grid;grid-template-columns:48mm 8mm 1fr 8mm 62mm;grid-auto-rows:1fr;align-items:center;row-gap:3mm}
        .une .ui{height:100%;max-height:36mm;display:flex;align-items:center;justify-content:center;border:.4mm solid #111;border-radius:2mm;padding:1mm;box-sizing:border-box}
        .une .punto{font-size:16pt;text-align:center}.une .up{font-size:20pt;font-weight:800}.une small{display:block;font-size:11pt;font-weight:500;color:#444}
        .rej2{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:5mm;min-height:0}
        .item{border:.5mm solid #111;border-radius:3mm;padding:3mm;display:flex;flex-direction:column;gap:2mm;align-items:center;justify-content:center;min-height:0;overflow:hidden}
        .item img{flex:1;min-height:0}
        .pal{font-size:22pt;font-weight:800;letter-spacing:.5mm;text-align:center;word-break:break-word}
        .hue{display:inline-block;width:9mm;height:11mm;border-bottom:.6mm solid #111;margin:0 .8mm;vertical-align:bottom}
        .lin{width:100%;height:13mm;border-bottom:.4mm solid #111;position:relative;display:flex;align-items:flex-end;justify-content:center}
        .calca{font-size:24pt;color:transparent;-webkit-text-stroke:.3mm #999;letter-spacing:1mm;font-weight:700}
        .dib .caja-d{flex:1;width:100%;border:.4mm dashed #777;border-radius:2mm}
        .etq .pal{font-size:30pt}.etq .sub,.tar .sub{font-size:14pt;color:#333}
        .tar{grid-template-rows:repeat(4,1fr)}.tar .pal{font-size:18pt}
        .resp{font-size:13pt;line-height:1.8}`,
    ventana(titulo, pags, desc) {
        const v = window.open('', '_blank');
        if (!v) return msg('El navegador bloqueó la ventana de impresión. Permite las ventanas emergentes para este sitio.');
        v.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(titulo)}</title>
            <style>@page{size:letter portrait;margin:5mm}${this.CSS}</style></head><body>
            <div class="barra"><b>${esc(desc)}</b><span>Imprime en <b>Carta</b>, <b>vertical</b>, escala 100 %.</span><button onclick="print()">🖨️ Imprimir o guardar PDF</button></div>${pags}
            <script>(function(){var h=false;function ir(){if(h)return;h=true;setTimeout(function(){window.print()},300)}var im=[].slice.call(document.images),p=im.length;if(!p)return ir();im.forEach(function(i){if(i.complete){if(--p===0)ir()}else{i.onload=i.onerror=function(){if(--p===0)ir()}}});setTimeout(ir,15000)})();<\/script></body></html>`);
        v.document.close();
        msg('Se abrió la vista de impresión.');
    }
};
function msg(html) { const m = $('lot-msg'); if (m) m.innerHTML = `<div class="caja">${html}</div>`; else UI.toast(String(html).replace(/<[^>]+>/g, '')); }

/* =============================================
   INICIO
   ============================================= */
(function () {
    A11y.init();
    const secs = ['explorar', 'aprender', 'jugar', 'imprimir', 'colabora'];
    const h = (location.hash || '').slice(1);
    UI.seccion = secs.includes(h) ? h : 'explorar';
    document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.sec === UI.seccion ? 'page' : 'false'));
    window.addEventListener('resize', () => UI.ajustarCabecera());
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape' || $('modal').style.display !== 'flex') return;
        if ($('lightbox').style.display === 'flex') { $('lightbox').style.display = 'none'; return; }
        if (!Juego.activo || confirm('¿Salir de la actividad?')) UI.cerrarModal();
    });
    window.addEventListener('online', () => UI.estadoConexion('Conectado'));
    window.addEventListener('offline', () => UI.estadoConexion('Sin conexión: puedes seguir consultando lo guardado', true));
    Datos.iniciar().then(() => { if (Datos.cargado) { UI.refrescar(); Loteria.revisarEnlace(); } });
})();
</script>
</body>
