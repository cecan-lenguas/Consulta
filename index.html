<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#2563eb">
    <title>Glosario</title>
    <!--
      Visor del catálogo multilingüe · versión 1.1
      Un solo archivo, sin dependencias externas. Funciona con cualquier catálogo:
        - API_URL fija (abajo), o ?api=<dirección del script>&token=<clave opcional> en el enlace.
      Secciones: Explorar · Aprender · Jugar · Imprimir · Colabora.
    -->
    <style>
        :root {
            --primary:#2563eb; --primary-light:#dbeafe; --bg-body:#f8fafc; --bg-card:#ffffff;
            --text-main:#0f172a; --text-sub:#475569; --border:#cbd5e1; --success:#16a34a; --error:#dc2626;
            --warn:#d97706; --shadow:0 10px 25px -5px rgba(0,0,0,0.1); --fs:1rem; --nav-h:64px;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg-body:#0f172a; --bg-card:#1e293b; --text-main:#f8fafc; --text-sub:#94a3b8; --border:#334155; --primary-light:#1e3a5f; }
        }
        body.high-contrast { --bg-body:#000; --bg-card:#111; --text-main:#fff; --text-sub:#ffd700; --border:#ffd700; --primary:#ffd700; --success:#00ff88; --error:#ff4444; --primary-light:#333; }
        * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif; background:var(--bg-body); color:var(--text-main); margin:0; font-size:var(--fs); line-height:1.55; padding-bottom:calc(var(--nav-h) + 20px); }
        a { color:var(--primary); }
        button { font:inherit; }
        .oculto { display:none !important; }
        .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
        :focus-visible { outline:3px solid var(--warn); outline-offset:2px; }

        /* ===== Encabezado ===== */
        header { padding:12px 16px 10px; background:var(--bg-card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1000; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
        .brand h1 { margin:0; color:var(--primary); font-size:clamp(1.15rem,4vw,1.6rem); letter-spacing:-0.4px; line-height:1.2; }
        .brand p { color:var(--text-sub); margin:0; font-size:0.85em; font-weight:500; }
        .a11y-bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
        .a11y-btn { border:2px solid var(--border); background:var(--bg-card); color:var(--text-main); border-radius:8px; padding:6px 10px; cursor:pointer; font-weight:700; font-size:0.85rem; min-width:38px; min-height:38px; }
        .a11y-btn:hover, .a11y-btn.active { border-color:var(--primary); color:var(--primary); }
        .lang-bar { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
        .lang-bar label { font-size:0.78em; font-weight:700; color:var(--text-sub); }
        .conn { font-size:0.75em; font-weight:700; padding:3px 9px; border-radius:20px; border:1px solid var(--border); color:var(--text-sub); }
        .conn.off { color:var(--warn); border-color:var(--warn); }

        /* ===== Navegación por secciones ===== */
        nav.secciones { position:fixed; left:0; right:0; bottom:0; height:var(--nav-h); background:var(--bg-card); border-top:1px solid var(--border); display:flex; z-index:1200; }
        nav.secciones button { flex:1; border:0; background:none; color:var(--text-sub); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:0.72rem; font-weight:700; cursor:pointer; min-height:44px; }
        nav.secciones button span.i { font-size:1.35rem; line-height:1; }
        nav.secciones button[aria-current="page"] { color:var(--primary); box-shadow:inset 0 3px 0 var(--primary); }
        @media (min-width:900px) {
            body { padding-bottom:20px; }
            nav.secciones { position:sticky; top:var(--hdr-h,96px); bottom:auto; height:52px; border-top:0; border-bottom:1px solid var(--border); z-index:900; }
            nav.secciones button { flex-direction:row; gap:8px; font-size:0.95rem; }
            nav.secciones button[aria-current="page"] { box-shadow:inset 0 -3px 0 var(--primary); }
        }
        main { max-width:1180px; margin:0 auto; padding:14px; }
        .titulo-seccion { margin:6px 0 12px; font-size:1.25rem; }
        .intro { color:var(--text-sub); margin:-6px 0 14px; }

        /* ===== Controles ===== */
        .btn { border:none; padding:12px 18px; border-radius:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:filter .15s, transform .1s; min-height:44px; text-decoration:none; }
        .btn:active { transform:scale(0.98); }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { filter:brightness(1.08); }
        .btn-secondary { background:transparent; border:2px solid var(--border); color:var(--text-main); }
        .btn-secondary:hover { border-color:var(--primary); }
        .btn-danger { background:transparent; border:2px solid var(--error); color:var(--error); }
        .btn-success { background:var(--success); color:#fff; }
        .btn:disabled { opacity:0.45; cursor:not-allowed; }
        .btn-block { width:100%; }
        .input-box, .modern-select { width:100%; padding:11px 13px; border-radius:12px; border:2px solid var(--border); background:var(--bg-card); color:var(--text-main); font-size:1em; min-height:44px; }
        .input-box:focus, .modern-select:focus { border-color:var(--primary); outline:none; }
        .fila { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        .fila > * { min-width:0; }
        .nota { font-size:0.82em; color:var(--text-sub); margin:4px 0; }
        .caja { background:var(--bg-body); border:2px solid var(--border); border-radius:14px; padding:12px; margin-top:10px; }
        .aviso { background:rgba(217,119,6,0.12); border:2px solid var(--warn); border-radius:12px; padding:9px 12px; margin-top:8px; }
        .error-box { background:rgba(220,38,38,0.10); border:2px solid var(--error); border-radius:12px; padding:9px 12px; margin-top:8px; }
        .ok-box { background:rgba(22,163,74,0.10); border:2px solid var(--success); border-radius:12px; padding:9px 12px; margin-top:8px; }
        .form { text-align:left; }
        .form .t { display:block; font-size:0.85em; font-weight:700; margin:12px 0 5px; }
        .chips { display:flex; flex-wrap:wrap; gap:6px; }
        .chip { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border:2px solid var(--border); border-radius:20px; cursor:pointer; font-size:0.88em; font-weight:600; background:var(--bg-card); min-height:40px; }
        .chip input { accent-color:var(--primary); width:18px; height:18px; margin:0; }
        .chip:has(input:checked) { border-color:var(--primary); background:var(--primary-light); }
        .acciones { display:grid; gap:8px; margin-top:14px; }

        /* ===== Explorar ===== */
        .buscador { display:grid; grid-template-columns:2fr 1fr; gap:8px; margin-bottom:12px; }
        @media (max-width:560px) { .buscador { grid-template-columns:1fr; } }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(130px,22vw,180px),1fr)); gap:14px; }
        .card { background:var(--bg-card); border-radius:16px; overflow:hidden; border:1px solid var(--border); cursor:pointer; transition:transform .2s, box-shadow .2s; text-align:left; padding:0; color:var(--text-main); }
        .card:hover, .card:focus-visible { transform:translateY(-3px); box-shadow:var(--shadow); }
        .card img { width:100%; aspect-ratio:1/1; object-fit:cover; background:#e5e7eb; display:block; }
        .card .card-body { padding:10px 12px 12px; }
        .card .card-body b { display:block; font-size:1.05em; line-height:1.25; word-break:break-word; }
        .card-tag { font-size:0.72em; font-weight:800; color:var(--primary); text-transform:uppercase; letter-spacing:0.5px; }
        .vacio { grid-column:1/-1; text-align:center; padding:40px; color:var(--text-sub); }

        /* Tarjetas de actividad (Aprender, Jugar, Imprimir) */
        .actividades { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
        .actividad { background:var(--bg-card); border:2px solid var(--border); border-radius:16px; padding:14px; text-align:left; cursor:pointer; display:flex; gap:12px; align-items:flex-start; color:var(--text-main); }
        .actividad:hover, .actividad:focus-visible { border-color:var(--primary); box-shadow:var(--shadow); }
        .actividad .ico { font-size:2rem; line-height:1; }
        .actividad b { display:block; font-size:1.05em; }
        .actividad .d { font-size:0.85em; color:var(--text-sub); display:block; margin-top:2px; }
        .actividad .req { font-size:0.75em; font-weight:700; margin-top:6px; display:inline-block; padding:2px 8px; border-radius:12px; }
        .actividad .req.si { color:var(--success); border:1px solid var(--success); }
        .actividad .req.no { color:var(--warn); border:1px solid var(--warn); }
        .actividad[aria-disabled="true"] { opacity:0.6; }

        /* Palabra del día */
        .dia { display:grid; grid-template-columns:140px 1fr; gap:14px; align-items:center; background:var(--bg-card); border:2px solid var(--primary); border-radius:18px; padding:14px; margin-bottom:16px; }
        .dia img { width:140px; height:140px; object-fit:cover; border-radius:14px; background:#e5e7eb; }
        .dia .w { font-size:clamp(1.5rem,6vw,2.2rem); font-weight:900; color:var(--primary); line-height:1.15; word-break:break-word; }
        @media (max-width:480px) { .dia { grid-template-columns:96px 1fr; } .dia img { width:96px; height:96px; } }

        /* ===== Modal ===== */
        .modal-overlay, #lightbox { display:none; position:fixed; inset:0; z-index:2000; justify-content:center; align-items:center; backdrop-filter:blur(6px); background:rgba(0,0,0,0.75); }
        .modal-content { background:var(--bg-card); width:96%; max-width:680px; max-height:94vh; border-radius:22px; padding:22px 20px 24px; overflow-y:auto; position:relative; animation:popUp .22s ease-out; }
        .modal-overlay.ancho .modal-content { max-width:1100px; }
        .modal-overlay.completa .modal-content { width:100vw; max-width:none; height:100vh; max-height:none; border-radius:0; padding:14px; }
        #lightbox img { max-width:95%; max-height:90vh; border-radius:12px; }
        @keyframes popUp { from{transform:scale(0.94) translateY(14px);opacity:0} to{transform:none;opacity:1} }
        .modal-close { position:absolute; top:10px; right:10px; background:var(--bg-card); border:2px solid var(--border); font-size:1.4rem; cursor:pointer; color:var(--text-sub); width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:12px; z-index:5; }
        .modal-close:hover { border-color:var(--primary); }
        .modal-titulo { color:var(--primary); margin:0 48px 12px 0; font-size:1.35rem; }

        /* Ficha de palabra */
        .ficha-img { width:100%; max-height:280px; object-fit:contain; border-radius:14px; background:#f1f5f9; cursor:zoom-in; display:block; margin-bottom:12px; }
        .trad { background:var(--bg-body); padding:12px; margin-bottom:8px; border-radius:12px; border:1px solid var(--border); }
        .trad .l { font-size:0.74em; color:var(--text-sub); font-weight:800; text-transform:uppercase; letter-spacing:0.4px; }
        .trad .x { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .trad .x span { font-size:1.2em; font-weight:700; word-break:break-word; }
        .trad .n { margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); font-size:0.88em; font-style:italic; }
        .audio-btn { min-width:44px; min-height:44px; border-radius:12px; border:2px solid var(--border); background:var(--bg-card); cursor:pointer; font-size:1.15rem; color:var(--text-main); }
        .audio-btn:hover { border-color:var(--primary); }
        .audio-btn.sonando { border-color:var(--success); }

        /* Avisos flotantes */
        .toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px); transform:translateX(-50%); background:var(--text-main); color:var(--bg-body); padding:10px 18px; border-radius:30px; font-weight:700; z-index:6000; max-width:92vw; text-align:center; animation:popUp .2s; pointer-events:none; }
        .anuncio { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:6000; background:var(--success); color:#fff; padding:12px 22px; border-radius:40px; font-weight:800; box-shadow:var(--shadow); pointer-events:none; max-width:92vw; text-align:center; animation:entra .4s ease-out, sale .5s ease-in 3.8s forwards; }
        @keyframes entra { from{transform:translate(-50%,-30px);opacity:0} to{transform:translate(-50%,0);opacity:1} }
        @keyframes sale { to{transform:translate(-50%,-30px);opacity:0} }
        .confeti { position:fixed; top:-40px; z-index:5999; pointer-events:none; font-size:1.6rem; animation:cae 2.8s linear forwards; }
        @keyframes cae { to{transform:translateY(110vh) rotate(360deg);opacity:0.3} }
        @media (prefers-reduced-motion: reduce) { *{animation:none !important;transition:none !important} .confeti{display:none} }

        /* ===== Juegos: comunes ===== */
        .score-board { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:12px; }
        .player-pill { padding:6px 14px; border-radius:20px; font-size:0.82em; font-weight:700; border:2px solid; display:flex; flex-direction:column; align-items:center; gap:2px; }
        .player-pill.activo { transform:scale(1.06); }
        .player-pill.rendido { opacity:0.4; text-decoration:line-through; }
        .p-time { font-family:monospace; font-size:0.78em; }
        .round-result { padding:12px 16px; border-radius:12px; margin:10px 0; font-weight:700; text-align:center; font-size:1.05em; }
        .round-result.win { background:rgba(22,163,74,0.1); color:var(--success); border:2px solid var(--success); }
        .round-result.fail { background:rgba(220,38,38,0.1); color:var(--error); border:2px solid var(--error); }
        .ranking-row { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; margin-bottom:8px; border-radius:14px; border:1px solid var(--border); background:var(--bg-body); gap:8px; }
        .chip-res { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:0.82em; font-weight:700; margin:3px; border:1px solid var(--border); background:var(--bg-body); cursor:pointer; color:var(--text-main); }
        .chip-res.ok { color:var(--success); border-color:var(--success); }
        .chip-res.fail { color:var(--error); border-color:var(--error); }
        .gran-palabra { font-size:clamp(1.6rem,7vw,2.6rem); font-weight:900; color:var(--primary); text-align:center; word-break:break-word; line-height:1.15; }
        .temporizador { font-family:monospace; font-weight:900; font-size:1.3em; }
        .temporizador.poco { color:var(--error); }

        /* Memorama */
        .memory-grid { display:grid; gap:8px; margin-top:8px; }
        .mem-card { aspect-ratio:1/1; border-radius:14px; cursor:pointer; position:relative; border:3px solid var(--border); overflow:hidden; background:var(--primary-light); padding:0; color:var(--text-main); }
        .mem-card.matched { opacity:0.45; border-color:var(--success); cursor:default; }
        .mem-card.flipped { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary); }
        .mem-face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:6px; text-align:center; flex-direction:column; gap:4px; }
        .mem-front { font-size:2rem; font-weight:900; color:var(--primary); }
        .mem-back { opacity:0; background:var(--bg-card); font-weight:800; word-break:break-word; font-size:clamp(0.8rem,3vw,1.05rem); }
        .mem-back img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
        .mem-back .cap { position:absolute; left:4px; right:4px; bottom:4px; background:rgba(255,255,255,0.92); color:#111; border-radius:6px; font-size:0.75em; padding:2px 4px; }
        .mem-card.flipped .mem-front, .mem-card.matched .mem-front { opacity:0; }
        .mem-card.flipped .mem-back, .mem-card.matched .mem-back { opacity:1; }

        /* Ahorcado */
        .hangman-wrap { font-family:monospace; white-space:pre; text-align:center; background:var(--bg-body); border-radius:12px; padding:10px; margin:8px 0; line-height:1.4; }
        .word-display { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:14px 0; }
        .word-display span { min-width:1.6em; padding:0 4px; border-bottom:3px solid var(--text-main); font-size:clamp(1.4rem,6vw,2.1rem); font-weight:900; text-align:center; color:var(--primary); }
        .word-display span.sep { border:0; min-width:0.8em; }
        .keyboard { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
        .key-btn { min-width:46px; min-height:46px; padding:0 8px; border-radius:10px; border:2px solid var(--border); background:var(--bg-card); color:var(--text-main); font-size:1.05em; font-weight:700; cursor:pointer; }
        .key-btn.correct { background:var(--success); color:#fff; border-color:var(--success); }
        .key-btn.wrong { opacity:0.4; }
        .hint-box { background:var(--bg-body); border:2px solid var(--primary); border-radius:12px; padding:10px 14px; margin:8px 0; text-align:center; }

        /* Sopa de letras */
        .ws-wrapper { overflow:auto; display:flex; justify-content:center; }
        .ws-grid { display:grid; gap:2px; margin:8px auto; touch-action:none; user-select:none; -webkit-user-select:none; }
        .ws-cell { display:flex; align-items:center; justify-content:center; border-radius:5px; font-weight:800; background:var(--bg-body); border:1px solid var(--border); cursor:pointer; user-select:none; -webkit-user-select:none; }
        .ws-cell.selected { background:var(--primary); color:#fff; border-color:var(--primary); }
        .word-list { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
        .word-chip { font-size:0.88em; font-weight:800; padding:5px 10px; border-radius:8px; border:2px solid var(--border); background:var(--bg-body); }

        /* Basta */
        .basta-letra { font-size:clamp(3rem,16vw,6rem); font-weight:900; color:var(--primary); text-align:center; line-height:1; margin:6px 0; }
        .basta-col { display:grid; grid-template-columns:minmax(110px,1fr) 2fr; gap:8px; align-items:center; margin-bottom:8px; }
        @media (max-width:480px) { .basta-col { grid-template-columns:1fr; gap:4px; } }
        .basta-col label { font-weight:800; }
        .basta-rev { border:2px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px; background:var(--bg-body); }
        .basta-rev .r { display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
        .seg { display:inline-flex; border:2px solid var(--border); border-radius:10px; overflow:hidden; }
        .seg button { border:0; background:var(--bg-card); padding:6px 10px; cursor:pointer; font-weight:700; color:var(--text-main); min-height:36px; }
        .seg button[aria-pressed="true"] { background:var(--primary); color:#fff; }

        /* Charadas */
        .charada { position:relative; display:flex; flex-direction:column; min-height:calc(100vh - 40px); gap:10px; }
        .charada .cabeza { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
        .charada .tarjeta { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; border-radius:18px; background:var(--bg-body); border:3px solid var(--border); padding:12px; min-height:240px; }
        .charada .tarjeta img { max-height:38vh; max-width:100%; object-fit:contain; border-radius:12px; background:#fff; }
        .charada .modo { font-weight:900; font-size:1.05em; padding:4px 12px; border-radius:20px; background:var(--primary); color:#fff; }
        .zonas { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .zona { min-height:24vh; border-radius:18px; border:0; font-size:clamp(1.2rem,5vw,1.8rem); font-weight:900; color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
        .zona.pasar { background:#d97706; } .zona.acierto { background:#16a34a; }
        .frente { position:fixed; inset:0; z-index:2100; display:grid; grid-template-columns:1fr 3fr 1fr; background:var(--bg-card); }
        .frente .lado { border:0; color:#fff; font-size:1.3rem; font-weight:900; cursor:pointer; writing-mode:vertical-rl; text-orientation:mixed; }
        .frente .lado.pasar { background:#d97706; } .frente .lado.acierto { background:#16a34a; }
        .frente .centro { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:10px; text-align:center; }
        .frente .centro img { max-height:45vh; max-width:100%; object-fit:contain; }
        .frente .w { font-size:clamp(2rem,9vw,4.5rem); font-weight:900; line-height:1.05; word-break:break-word; }
        .flash-ok { animation:flashOk .5s; } .flash-pasa { animation:flashPasa .5s; }
        @keyframes flashOk { 0%{background:#16a34a} 100%{background:var(--bg-card)} }
        @keyframes flashPasa { 0%{background:#d97706} 100%{background:var(--bg-card)} }
        .oculta-palabra { filter:blur(18px); user-select:none; }
        .tv .temporizador { font-size:3rem; } .tv .marcador { font-size:1.4rem; }

        /* Aprender */
        .opciones-img { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .opcion-img { border:3px solid var(--border); border-radius:14px; padding:0; overflow:hidden; background:#fff; cursor:pointer; aspect-ratio:1; }
        .opcion-img img { width:100%; height:100%; object-fit:cover; }
        .opcion-img.bien { border-color:var(--success); box-shadow:0 0 0 3px var(--success); }
        .opcion-img.mal { border-color:var(--error); opacity:0.6; }

        /* ===== Lotería ===== */

        .lot-sel.on::after { content:'✓'; position:absolute; top:6px; right:6px; background:var(--success); color:#fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
        .lot-carta { border:3px solid #111; border-radius:14px; padding:10px; background:#fff; color:#111; width:min(260px,70vw); aspect-ratio:65/101; margin:0 auto; display:flex; flex-direction:column; gap:6px; }
        .lot-carta .num { font-weight:900; font-size:1.4em; line-height:1; }
        .lot-carta .img { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
        .lot-carta img { max-width:100%; max-height:100%; object-fit:contain; }
        .lot-nombre { border:2px solid #111; border-radius:8px; padding:4px 8px; font-weight:800; text-align:center; background:#fff; color:#111; word-break:break-word; }
        .lot-codigo { background:var(--bg-body); border:2px dashed var(--primary); border-radius:14px; padding:10px; margin-bottom:10px; text-align:center; }
        .lot-codigo b { font-size:1.6em; letter-spacing:2px; color:var(--primary); }
        .lot-contador { text-align:center; font-weight:800; font-size:1.1em; margin:8px 0; }
        .lot-hist { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
        .lot-hist figure { margin:0; width:64px; text-align:center; font-size:0.68em; line-height:1.15; }
        .lot-hist img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:2px solid var(--border); background:#fff; }
        .lot-variantes { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:10px 0; }
        .lot-var { padding:5px 10px; border-radius:20px; border:2px solid var(--border); font-size:0.8em; font-weight:700; }
        .lot-var.ganada { border-color:var(--success); color:var(--success); }
        .lot-tabla { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
        .lot-celda { position:relative; border:2px solid #555; border-radius:10px; background:#fff; color:#111; padding:3px; cursor:pointer; display:flex; flex-direction:column; gap:2px; aspect-ratio:3/4; min-width:0; }
        .lot-celda img { width:100%; flex:1; min-height:0; object-fit:contain; }
        .lot-celda .n { position:absolute; top:2px; left:4px; font-size:0.65em; font-weight:900; background:#fff; border-radius:4px; padding:0 3px; }
        .lot-celda .nm { font-size:clamp(0.55rem,2.6vw,0.78rem); font-weight:800; line-height:1.1; word-break:break-word; text-align:center; }
        .lot-celda.marcada { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary); }
        .lot-celda.marcada::after { content:'🫘'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(1.8rem,9vw,2.8rem); background:rgba(37,99,235,0.22); border-radius:8px; }
        .lot-celda.salio { box-shadow:0 0 0 3px var(--success); }
        .lot-celda.nosalio { opacity:0.45; }
        .lot-salio { display:flex; align-items:center; gap:10px; background:var(--bg-body); border-radius:12px; padding:8px; border:2px solid var(--border); }
        .lot-salio img { width:56px; height:56px; object-fit:cover; border-radius:8px; background:#fff; }

        /* ===== Colabora ===== */
        .contacto { display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
        .texto-largo { white-space:pre-line; }
    </style>
</head>

<script>
/* =====================================================================
   VISOR DEL CATÁLOGO MULTILINGÜE · 1.1
   Ninguna lengua es obligatoria: cada palabra (concepto) se muestra en la
   lengua elegida y, si no existe, en la siguiente disponible.
   ===================================================================== */

/* Dirección del script del catálogo. Puede quedar vacía: entonces se toma de
   ?api=… en el enlace, o se pide al abrir. */
const API_URL   = "https://script.google.com/macros/s/AKfycbwSm6SuBp1_kWQCuAcY9hohoxx-ExhGdBcMjkBj2ITWqPaVpFFCocbnr-58y-vciDe0/exec";
const API_TOKEN = "";
const VERSION_VISOR = '1.1';

/* =============================================
   UTILIDADES
   ============================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
    get(k, def = null) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function hash32(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
    h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
    return (h ^= h >>> 16) >>> 0;
}
/** Azar reproducible: la misma semilla da el mismo resultado en cualquier dispositivo. */
function azar(semilla) {
    let a = hash32(String(semilla));
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function barajar(arr, r = Math.random) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}
const elegir = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
function azarSeguro(n) { const v = new Uint32Array(1); crypto.getRandomValues(v); return v[0] % n; }
function cuatroDigitos() { return String(azarSeguro(10000)).padStart(4, '0'); }
function fmtTiempo(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function descargar(nombre, contenido, tipo = 'text/html') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([contenido], { type: tipo }));
    a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function placeholder(letra) {
    const l = String(letra || '?').slice(0, 2);
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' rx='16' fill='#94a3b8'/><text x='150' y='195' font-family='system-ui,sans-serif' font-size='140' font-weight='900' fill='white' text-anchor='middle'>${l.replace(/[<&>'"]/g, '')}</text></svg>`;
    // Sin comillas simples ni dobles: se puede usar con seguridad dentro de atributos HTML
    return 'data:image/svg+xml,' + encodeURIComponent(svg).replace(/'/g, '%27');
}

/* =============================================
   ACCESIBILIDAD
   ============================================= */
const A11y = {
    escalas: [0.85, 1, 1.15, 1.35, 1.6], idx: 1,
    init() {
        this.idx = LS.get('a11y_escala', 1);
        this.aplicar();
        if (LS.get('a11y_contraste', false)) { document.body.classList.add('high-contrast'); $('btn-contrast').classList.add('active'); }
    },
    aplicar() { document.documentElement.style.setProperty('--fs', this.escalas[this.idx] + 'rem'); LS.set('a11y_escala', this.idx); UI.ajustarCabecera(); },
    smaller() { if (this.idx > 0) { this.idx--; this.aplicar(); } },
    larger() { if (this.idx < this.escalas.length - 1) { this.idx++; this.aplicar(); } },
    reset() { this.idx = 1; this.aplicar(); },
    toggleContrast() {
        const on = document.body.classList.toggle('high-contrast');
        LS.set('a11y_contraste', on); $('btn-contrast').classList.toggle('active', on);
    }
};

/* =============================================
   TEXTO: escritura, alfabetos y comparación
   ============================================= */
const Texto = {
    _tokens: new Map(), _alfa: new Map(),
    _seg: (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('und', { granularity: 'grapheme' }) : null,
    /** Atajos de escritura de la lengua (p. ej. + → ɨ), los mismos que usa el equipo al registrar. */
    atajos(s, L) {
        let t = String(s ?? '');
        const lengua = Datos.langById.get(String(L));
        (lengua?.atajos || []).forEach(([b, r, mayus]) => {
            if (!b) return;
            t = mayus ? t.split(b).join(r) : t.replace(new RegExp(b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'giu'), () => r);
        });
        return t.normalize('NFC');
    },
    /** Comparación tolerante: minúsculas, sin acentos, apóstrofos unificados. */
    pliegue(s) {
        return String(s ?? '').normalize('NFC').toLowerCase().normalize('NFD').replace(/\p{M}/gu, '')
            .replace(/[’'ʼꞌ´`]/g, "'").replace(/\s+/g, ' ').trim();
    },
    /** Letras del alfabeto declarado de la lengua (con dígrafos), ordenadas de la más larga a la más corta. */
    tokens(L) {
        if (this._tokens.has(L)) return this._tokens.get(L);
        const a = (Datos.langById.get(String(L))?.alfabeto || '').normalize('NFC').toLowerCase().split(/\s+/).filter(Boolean);
        const t = [...new Set(a)].sort((x, y) => y.length - x.length);
        this._tokens.set(L, t);
        return t;
    },
    /** Divide una palabra en sus letras reales: "chɨkwa" con alfabeto [ch, kw…] → ch·ɨ·kw·a. */
    grafemas(s, L) {
        const t = String(s ?? '').normalize('NFC').toLowerCase();
        const toks = L ? this.tokens(L) : [];
        const out = [];
        let i = 0;
        while (i < t.length) {
            const m = toks.find(k => t.startsWith(k, i));
            if (m) { out.push({ g: m, letra: true }); i += m.length; continue; }
            let g;
            if (this._seg) { const r = this._seg.segment(t.slice(i, i + 8))[Symbol.iterator]().next().value; g = r ? r.segment : t[i]; }
            else { g = t[i]; let j = i + 1; while (j < t.length && /\p{M}/u.test(t[j])) g += t[j++]; }
            out.push({ g, letra: /[\p{L}Ꞌꞌʼ]/u.test(g) });
            i += g.length;
        }
        return out;
    },
    letras(s, L) { return this.grafemas(s, L).filter(x => x.letra).map(x => x.g); },
    /** Alfabeto para teclados y juegos: el declarado o, si no hay, el que aparece en las palabras. */
    alfabeto(L) {
        if (this._alfa.has(L)) return this._alfa.get(L);
        let a = this.tokens(L).slice();
        if (a.length) {
            const orden = (Datos.langById.get(String(L))?.alfabeto || '').normalize('NFC').toLowerCase().split(/\s+/).filter(Boolean);
            a = [...new Set(orden)];
        } else {
            const vistos = new Set();
            Datos.words.forEach(w => { const t = w.t[L]; if (t) this.letras(t.texto).forEach(g => vistos.add(g)); });
            a = [...vistos].sort((x, y) => x.localeCompare(y, 'es'));
        }
        this._alfa.set(L, a);
        return a;
    },
    /** Atributo lang para lectores de pantalla y tipografía (solo con código ISO válido). */
    lang(L) { const iso = Datos.langById.get(String(L))?.iso; return /^[a-z]{2,3}$/.test(iso || '') ? ` lang="${iso}"` : ''; },
    limpiarCaches() { this._tokens.clear(); this._alfa.clear(); }
};

/* =============================================
   DATOS DEL CATÁLOGO (con copia para usar sin conexión)
   ============================================= */
const Datos = {
    base: '', token: '', cfg: {}, langs: [], langById: new Map(), cats: new Map(), words: [], byId: new Map(),
    lengua: '', principal: '', version: '', cargado: false, _conteos: new Map(),

    async iniciar() {
        const p = new URLSearchParams(location.search);
        if (p.get('api')) LS.set('glosario_url', p.get('api'));
        if (p.get('token')) LS.set('glosario_token', p.get('token'));
        this.base = (API_URL || LS.get('glosario_url', '') || '').split('?')[0];
        this.token = p.get('token') || API_TOKEN || LS.get('glosario_token', '') || '';
        $('btn-cambiar-base').style.display = API_URL ? 'none' : '';
        if (!this.base) return UI.pantallaConexion();

        const copia = LS.get('cat:' + this.base);
        if (copia && copia.data) { this.cargar(copia.data, copia.version); UI.refrescar(); UI.estadoConexion(navigator.onLine ? 'Actualizando…' : 'Sin conexión: última versión guardada', !navigator.onLine); }
        try {
            let version = '';
            if (copia) {
                const m = await this.api({ action: 'manifiesto' }, 6000).catch(() => null);
                version = m && m.version || '';
                if (version && version === copia.version) { UI.estadoConexion('Al día'); return; }
            }
            const r = await this.api({ action: 'glosario' }, 20000);
            if (r.status === 401) throw new Error('Este catálogo pide una clave. Abre el enlace con la clave (…&token=…).');
            if (r.status !== 200 || !r.data) throw new Error(r.error || 'Respuesta inesperada del catálogo.');
            this.cargar(r.data, r.version || version);
            if (!LS.set('cat:' + this.base, { version: r.version || version, data: r.data, t: Date.now() })) console.warn('Sin espacio para guardar la copia sin conexión.');
            UI.estadoConexion('Al día');
            UI.refrescar();
        } catch (e) {
            if (this.cargado) UI.estadoConexion('Sin conexión: última versión guardada', true);
            else UI.pantallaConexion(e.message);
        }
    },

    async api(params, espera = 15000) {
        const u = new URL(this.base);
        Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
        if (this.token) u.searchParams.set('token', this.token);
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), espera);
        try { const r = await fetch(u.toString(), { signal: ctl.signal }); return await r.json(); }
        finally { clearTimeout(t); }
    },
    async post(datos) {
        const r = await fetch(this.base, { method: 'POST', body: JSON.stringify(Object.assign({ token: this.token }, datos)) });
        return r.json();
    },

    cargar(d, version) {
        this.version = version || '';
        this.cfg = d.config || {};
        this.langs = (d.idiomas || []).map(i => ({
            id: String(i.id_idioma), nombre: String(i.nombre_propio || i.nombre_completo || i.nombre || i.id_idioma),
            otro: String(i.nombre_completo || i.nombre || ''), iso: String(i.codigo_iso || '').toLowerCase(),
            variante: String(i.variante || ''), alfabeto: String(i.alfabeto || ''), atajos: Array.isArray(i.atajos) ? i.atajos : []
        }));
        this.langById = new Map(this.langs.map(l => [l.id, l]));
        this.cats = new Map();
        (d.categorias || []).forEach(c => {
            const id = String(c.id_categoria || '').trim();
            if (id) this.cats.set(id, { id, nombre: String(c.nombre_categoria || c.nombre || 'Sin nombre'), trads: c.traducciones || {} });
        });
        const map = new Map();
        (d.palabras || []).forEach(p => {
            const id = String(p.id_palabra || '').trim();
            if (!id) return;
            map.set(id, { id, cat: String(p.id_categoria || '').trim(), img: String(p.imagen_referencia || ''), imgId: String(p.imagen_id || ''),
                juegos: p.juegos !== false && String(p.usar_en_juegos || '').toLowerCase() !== 'no', t: {} });
        });
        (d.traducciones || []).forEach(t => {
            const w = map.get(String(t.id_palabra || '').trim());
            const texto = String(t.texto ?? '').trim();
            if (!w || !texto) return;
            w.t[String(t.id_idioma)] = { texto, audio: String(t.audio || ''), nota: String(t.nota_variante || t.variante || ''), silabas: String(t.silabas || '') };
        });
        this.words = [...map.values()].filter(w => Object.keys(w.t).length);
        this.byId = new Map(this.words.map(w => [w.id, w]));
        // Lengua de referencia de la interfaz: la que eligió la persona, la del catálogo, o la primera con palabras
        const conPalabras = this.langs.filter(l => this.words.some(w => w.t[l.id]));
        this.principal = this.langById.has(String(this.cfg.idiomaPrincipal)) ? String(this.cfg.idiomaPrincipal) : (conPalabras[0]?.id || '');
        const guardada = LS.get('lengua:' + this.base);
        this.lengua = this.langById.has(guardada) ? guardada : this.principal;
        this._conteos.clear(); Texto.limpiarCaches();
        this.cargado = true;
        document.title = this.cfg.titulo || 'Glosario';
        $('app-title').textContent = this.cfg.titulo || 'Glosario';
        $('app-sub').textContent = this.cfg.subtitulo || `${this.words.length} palabras · ${conPalabras.length} lenguas`;
        const sel = $('sel-lengua');
        sel.innerHTML = conPalabras.map(l => `<option value="${esc(l.id)}">${esc(l.nombre)}${l.otro && l.otro !== l.nombre ? ' · ' + esc(l.otro) : ''}</option>`).join('');
        sel.value = this.lengua;
        UI.ajustarCabecera();
    },

    fijarLengua(L) { this.lengua = L; LS.set('lengua:' + this.base, L); UI.refrescar(); },
    cambiarCatalogo() { if (confirm('¿Conectar otro catálogo?')) { LS.del('glosario_url'); LS.del('glosario_token'); location.href = location.pathname; } },

    nombreLengua(L) { return this.langById.get(String(L))?.nombre || String(L); },
    /** Texto de una palabra en la lengua pedida; si no existe, en la de referencia; si no, el primero. */
    texto(w, L = this.lengua) { if (!w) return ''; const t = w.t[L] || w.t[this.principal] || Object.values(w.t)[0]; return t ? t.texto : ''; },
    tieneEn(w, L) { return !!(w && w.t[L]); },
    categoria(id, L = this.lengua) {
        const c = this.cats.get(String(id || '').trim());
        if (!c) return 'General';
        return c.trads[L] || c.trads[this.principal] || c.nombre;
    },
    img(w, ancho = 400) {
        const u = w?.img || '';
        if (/^https:\/\/lh3\.googleusercontent\.com\/d\/[^=?#]+$/.test(u)) return `${u}=w${ancho}`;
        return u;
    },
    /** Palabras disponibles para juegos en una lengua, con condiciones opcionales. */
    paraJuegos(L, { img = false, audio = false, cats = null, largas = false } = {}) {
        return this.words.filter(w => {
            if (!w.juegos || !w.t[L]) return false;
            if (img && !w.img) return false;
            if (audio && !w.t[L].audio) return false;
            if (cats && cats.length && !cats.includes(w.cat)) return false;
            if (largas && Texto.letras(w.t[L].texto, L).length < 3) return false;
            return true;
        });
    },
    conteo(L) {
        if (this._conteos.has(L)) return this._conteos.get(L);
        const c = { img: 0, imgAudio: 0, audio: 0, largas: 0, cats: 0, textos: 0, lenguas: 0 };
        const cats = new Set();
        this.words.forEach(w => {
            const t = w.t[L];
            if (!t) return;
            c.textos++;
            if (!w.juegos) return;
            if (w.img) c.img++;
            if (t.audio) c.audio++;
            if (w.img && t.audio) c.imgAudio++;
            if (Texto.letras(t.texto, L).length >= 3) c.largas++;
            if (w.cat && this.cats.has(w.cat)) cats.add(w.cat);
        });
        c.cats = cats.size;
        c.lenguas = this.langs.filter(l => this.words.filter(w => w.t[l.id]).length >= 10).length;
        this._conteos.set(L, c);
        return c;
    },
    palabrasDe(ids) { return ids.map(id => this.byId.get(id)).filter(Boolean); }
};

/* =============================================
   SONIDO (audios de hablantes) y efectos
   ============================================= */
const Sonido = {
    cache: new Map(), actual: null,
    async tocar(archivo, boton) {
        if (!archivo) return;
        try {
            if (boton) boton.classList.add('sonando');
            let datos = this.cache.get(archivo);
            if (!datos) {
                const r = await Datos.api({ type: 'audio', file: archivo }, 20000);
                if (r.status !== 'ok' || !r.audioData) throw new Error(r.error || 'Audio no disponible');
                datos = r.audioData;
                if (this.cache.size > 80) this.cache.delete(this.cache.keys().next().value);
                this.cache.set(archivo, datos);
            }
            if (this.actual) this.actual.pause();
            this.actual = new Audio(datos);
            await this.actual.play();
            this.actual.onended = () => boton && boton.classList.remove('sonando');
        } catch (e) {
            if (boton) boton.classList.remove('sonando');
            UI.toast(navigator.onLine ? 'No se pudo reproducir el audio.' : 'El audio necesita conexión a internet.');
        }
    },
    deTexto(w, L) { return w?.t[L]?.audio || ''; },
    boton(w, L, etiqueta = '🔊') {
        const a = this.deTexto(w, L);
        return a ? `<button class="audio-btn" data-audio="${esc(a)}" aria-label="Escuchar ${esc(Datos.texto(w, L))}" title="Escuchar">${etiqueta}</button>` : '';
    }
};
// Cualquier botón con data-audio reproduce su audio (evita código dentro de atributos)
document.addEventListener('click', e => { const b = e.target.closest('[data-audio]'); if (b) { e.stopPropagation(); Sonido.tocar(b.dataset.audio, b); } }, true);

const SoundFX = {
    _ctx: null, _get() { if (!this._ctx) this._ctx = new (window.AudioContext || window.webkitAudioContext)(); return this._ctx; },
    _tone(f, d, type = 'sine', vol = 0.25) { try { const c = this._get(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d); o.start(); o.stop(c.currentTime + d); } catch (e) {} },
    ok() { this._tone(880, 0.12); }, error() { this._tone(220, 0.25, 'sawtooth', 0.12); },
    win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this._tone(f, 0.18, 'sine', 0.2), i * 80)); },
    fail() { [440, 349, 294, 220].forEach((f, i) => setTimeout(() => this._tone(f, 0.2, 'sawtooth', 0.12), i * 80)); },
    vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
};

const Pantalla = {
    lock: null,
    async mantener() { try { if ('wakeLock' in navigator) this.lock = await navigator.wakeLock.request('screen'); } catch (e) {} },
    liberar() { try { this.lock && this.lock.release(); } catch (e) {} this.lock = null; }
};

const Explorar = {
    q: '', cat: 'all', limite: 120,
    pintar(v) {
        const cats = [...Datos.cats.values()].filter(c => Datos.words.some(w => w.cat === c.id));
        v.innerHTML = `
            <h2 class="sr">Explorar</h2>
            <div class="buscador">
                <input type="search" id="buscar" class="input-box" placeholder="🔍 Buscar en cualquier lengua…" value="${esc(Explorar.q)}" aria-label="Buscar palabra" autocomplete="off">
                <select id="filtro-cat" class="modern-select" aria-label="Categoría">
                    <option value="all">Todas las categorías</option>
                    ${cats.map(c => `<option value="${esc(c.id)}" ${Explorar.cat === c.id ? 'selected' : ''}>${esc(Datos.categoria(c.id))}</option>`).join('')}
                </select>
            </div>
            <div id="grid" class="grid" role="list"></div>
            <div style="text-align:center;margin-top:14px"><button id="mas" class="btn btn-secondary oculto">Mostrar más</button></div>`;
        $('buscar').addEventListener('input', e => { Explorar.q = e.target.value; Explorar.limite = 120; Explorar.lista(); });
        $('filtro-cat').addEventListener('change', e => { Explorar.cat = e.target.value; Explorar.limite = 120; Explorar.lista(); });
        $('mas').addEventListener('click', () => { Explorar.limite += 120; Explorar.lista(); });
        $('grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) Ficha.abrir(c.dataset.id); });
        Explorar.lista();
    },
    lista() {
        const L = Datos.lengua;
        const q = Texto.pliegue(Texto.atajos(Explorar.q, L));
        const res = Datos.words.filter(w => (Explorar.cat === 'all' || w.cat === Explorar.cat) &&
            (!q || Object.values(w.t).some(t => Texto.pliegue(t.texto).includes(q))));
        res.sort((a, b) => Number(!a.t[L]) - Number(!b.t[L]) || Datos.texto(a).localeCompare(Datos.texto(b), 'es'));
        const g = $('grid');
        if (!res.length) { g.innerHTML = `<div class="vacio">Sin resultados.${q ? ' ¿Conoces esta palabra? Compártela en <b>Colabora</b>.' : ''}</div>`; $('mas').classList.add('oculto'); return; }
        g.innerHTML = res.slice(0, Explorar.limite).map(w => {
            const t = Datos.texto(w), propia = w.t[L];
            const ph = placeholder([...t][0]);
            return `<button class="card" role="listitem" data-id="${esc(w.id)}" aria-label="${esc(t)}">
                <img src="${esc(Datos.img(w, 400) || ph)}" loading="lazy" alt="" onerror="this.onerror=null;this.src='${ph}'">
                <div class="card-body"><b${Texto.lang(propia ? L : '')}>${esc(t)}</b>
                <span class="card-tag">${esc(Datos.categoria(w.cat))}</span>${propia ? '' : `<span class="nota" style="display:block">sin registro en ${esc(Datos.nombreLengua(L))}</span>`}</div>
            </button>`;
        }).join('');
        $('mas').classList.toggle('oculto', res.length <= Explorar.limite);
    }
};

const Ficha = {

        const w = Datos.byId.get(id); if (!w) return;
